<div class="rolebar">
  <span class="brand">🌈 Yumurcak</span>
  <div class="role-picker" aria-label="Panel seçimi">
    <button class="role-option active" data-role="parent" onclick="switchRole('parent')">👨‍👩‍👧 Veli</button>
    <button class="role-option" data-role="teacher" onclick="switchRole('teacher')">👩‍🏫 Öğretmen</button>

</section></main>
<script>
let role='parent',tab='Anasayfa',language='Türkçe',growthMode='monthly',reportMode='daily';
const parentTabs=[['Özet','📊'],['Anasayfa','🏠'],['Rapor','📋'],['Gelişim','📈'],['Mesaj','💬']],teacherTabs=[['Özet','📊'],['Anasayfa','🏠'],['Yoklama','☑️'],['Rapor','📋'],['Mesaj','💬']],adminTabs=[['Özet','📊'],['Anasayfa','🏠'],['Çocuklar','👧'],['Rapor','📋'],['Mesaj','💬']];
function switchRole(r){role=r;tab='Anasayfa';render()}
function tabs(){return role==='parent'?parentTabs:role==='teacher'?teacherTabs:adminTabs}
function render(){document.querySelectorAll('.role-option').forEach(b=>b.classList.toggle('active',b.dataset.role===role));document.getElementById('nav').innerHTML=tabs().map(([t,i])=>`<button class="${tab===t?'active':''}" onclick="go('${t}')"><span class="ico">${i}</span>${t}</button>`).join('');document.getElementById('screen').innerHTML=role==='parent'?parentPage():role==='teacher'?teacherPage():adminPage();document.getElementById('screen').scrollTop=0}
function go(t){tab=t;render()}
function header(title,sub,ico='👤'){return `<div class="pagehead"><button class="back" onclick="go('Anasayfa')">❮ Geri</button><div style="text-align:center"><strong>${title}</strong>${sub?`<div class="date">${sub}</div>`:''}</div><span class="rightico">${ico}</span></div>`}

function tile(title,desc,emoji,color){const h=CARD_HELP[title]||[title,desc+'\\n• Kartı açarak bu özelliğin Yumurcak içinde ne işe yaradığını öğrenebilirsiniz.'];return `<button class="tile ${color}" aria-label="${title} hakkında bilgi al" onclick="explainEncoded('${encodeURIComponent(JSON.stringify(h)).replace(/'/g,'%27')}')"><span class="emoji">${emoji}</span><b>${title}</b><small>${desc}</small><span class="tilehint">Detayları gör ›</span></button>`}
function quick(title,desc,emoji){return `<button class="quick" onclick="explain('${title}','${desc}')"><span class="qico">${emoji}</span><span><b>${title}</b><small>${desc}</small></span></button>`}
